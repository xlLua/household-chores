<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED or env(safe-area-inset-*) resolves to 0
         and the bottom tab bar sits under the iPhone home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Huishoudtaken voor het appartement." />
    <meta name="theme-color" content="#F5EEE1" />
    <!-- Resolve light/dark before first paint so there's no flash of the wrong
         theme. Mirrors src/lib/theme.ts -- keep the two in step. -->
    <script>
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#1F2430' : '#F5EEE1')
      })()
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Onder één Hoedje" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />

    <title>Onder één Hoedje — Van Rijswijck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
